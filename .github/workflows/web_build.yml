name: Web Build

on:
  push:
    paths:
      - 'pkgs/liquify/**'
      - 'site/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/web_build.yml'
  pull_request:
    paths:
      - 'pkgs/liquify/**'
      - 'site/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/web_build.yml'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkgs/liquify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze Jaspr playground
        run: dart analyze web

      - name: Build Jaspr playground
        run: dart run build_runner build --release -o web:../liquify_pages

      - name: Build documentation
        working-directory: .
        run: bash site/build.sh

      - name: Verify static site
        run: |
          test -s ../liquify_pages/index.html
          test -s ../liquify_pages/styles.css
          test -s ../liquify_pages/main.dart.js
          test -s ../liquify_pages/theme.css
          test -s ../liquify_pages/theme.js
          test -s ../liquify_pages/docs_examples.dart.js
          test -s ../liquify_pages/docs/index.html
          test -s ../liquify_pages/docs/tags/layout/index.html
          test -s ../liquify_pages/docs/styles.css

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: pkgs/liquify_pages

  deploy-pages:
    needs: build-web
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
