name: Jaspr Playground

on:
  push:
    paths:
      - 'prototypes/jaspr_playground/**'
      - 'pkgs/liquify/**'
      - '.github/workflows/jaspr_build.yml'
  pull_request:
    paths:
      - 'prototypes/jaspr_playground/**'
      - 'pkgs/liquify/**'
      - '.github/workflows/jaspr_build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/jaspr_playground
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get --enforce-lockfile
      - run: dart analyze
      - name: Build client
        run: dart run build_runner build --release -o web:build/site
      - name: Verify static site
        run: |
          test -s build/site/index.html
          test -s build/site/styles.css
          test -s build/site/main.dart.js
      - uses: actions/upload-artifact@v4
        with:
          name: jaspr-playground
          path: prototypes/jaspr_playground/build/site/
          if-no-files-found: error
